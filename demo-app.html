<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>School Management System — Live Interactive Demo</title>
  <meta name="description" content="Live interactive demo of an offline-first desktop School Management System. Four role-based workspaces, randomized data, fully in-browser." />
  <meta name="author" content="Muhammad Amin Khan &amp; Munawar Khan" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            canvas: '#05070c', surface: '#090c13', panel: '#0f131c', panel2: '#141926',
            elevated: '#1a2030', ink: '#e9edf6', ink2: '#b9c1d3', muted: '#8992a8',
            dim: '#596074',
          }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root { --accent:#4c7df0; --accent-2:#7aa2ff; --accent-ink:#ffffff; color-scheme: dark; }
    html.dark { color-scheme: dark; }
    html.light { color-scheme: light; --canvas:#eef1f7; }
    [data-accent='admin'] { --accent:#4c7df0; --accent-2:#7aa2ff; --accent-ink:#fff; }
    [data-accent='office'] { --accent:#10b981; --accent-2:#5eead4; --accent-ink:#04231a; }
    [data-accent='teacher'] { --accent:#8b5cf6; --accent-2:#b18bff; --accent-ink:#fff; }
    [data-accent='student'] { --accent:#f59e0b; --accent-2:#fcd34d; --accent-ink:#2a1a02; }
    body { margin:0; background:var(--canvas,#05070c); color:var(--ink,#e9edf6); font-family:Inter,system-ui,sans-serif; overflow:hidden; }
    .app-bg { background: radial-gradient(1100px 620px at 88% -12%, color-mix(in srgb,var(--accent) 24%,transparent), transparent 62%), radial-gradient(820px 520px at 8% 108%, color-mix(in srgb,var(--accent) 12%,transparent), transparent 60%), #05070c; }
    html.light body, html.light .app-bg { background:#eef1f7; color:#0f172a; }
    .glass { background: rgba(255,255,255,0.028); border:1px solid rgba(255,255,255,0.07); backdrop-filter: blur(14px); }
    .panel-solid { background:#0f131c; border:1px solid rgba(255,255,255,0.07); border-radius:16px; }
    html.light .panel-solid { background:#fff; border-color:rgba(15,23,42,0.09); }
    .nav-item { display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:11px; font-size:13.5px; font-weight:500; color:#8992a8; border:1px solid transparent; transition:all .15s; cursor:pointer; }
    .nav-item:hover { background:rgba(255,255,255,0.045); color:#e9edf6; }
    .nav-item-active { background:color-mix(in srgb,var(--accent) 14%,transparent); border-color:color-mix(in srgb,var(--accent) 34%,transparent); color:#e9edf6; }
    .nav-item-active .nav-icon { color:var(--accent); }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:38px; padding:0 16px; border-radius:11px; border:1px solid rgba(255,255,255,0.07); background:rgba(255,255,255,0.045); color:#e9edf6; font-size:13.5px; font-weight:500; cursor:pointer; transition:all .15s; white-space:nowrap; }
    .btn:hover:not(:disabled){ background:color-mix(in srgb,#e9edf6 8%,transparent); border-color:rgba(255,255,255,0.12); }
    .btn-primary { background:linear-gradient(180deg,var(--accent-2),var(--accent)); border-color:color-mix(in srgb,var(--accent) 70%,transparent); color:var(--accent-ink); box-shadow:0 8px 22px -12px color-mix(in srgb,var(--accent) 90%,transparent); }
    .btn-sm { height:32px; padding:0 12px; font-size:12.5px; border-radius:9px; }
    .input { height:40px; width:100%; padding:0 13px; border-radius:11px; background:rgba(5,7,12,0.55); border:1px solid rgba(255,255,255,0.07); color:#e9edf6; font-size:13.5px; }
    .input:focus { outline:none; border-color:color-mix(in srgb,var(--accent) 70%,transparent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent); }
    .chip { display:inline-flex; align-items:center; gap:6px; height:22px; padding:0 9px; border-radius:999px; font-size:11.5px; font-weight:500; border:1px solid rgba(255,255,255,0.07); background:rgba(255,255,255,0.045); color:#8992a8; white-space:nowrap; }
    .data-table { width:100%; border-collapse:separate; border-spacing:0; font-size:13px; }
    .data-table thead th { position:sticky; top:0; z-index:1; text-align:start; font-size:11.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:#596074; background:#141926; padding:11px 14px; border-bottom:1px solid rgba(255,255,255,0.07); white-space:nowrap; }
    .data-table tbody td { padding:12px 14px; border-bottom:1px solid rgba(255,255,255,0.07); color:#b9c1d3; vertical-align:middle; }
    .data-table tbody tr:hover { background:rgba(233,237,246,0.04); }
    .stat-card { background:linear-gradient(180deg,rgba(255,255,255,0.026),rgba(255,255,255,0.008)); border:1px solid rgba(255,255,255,0.07); border-radius:17px; padding:20px; }
    .toast { position:fixed; left:50%; bottom:28px; transform:translate(-50%,16px); opacity:0; pointer-events:none; padding:10px 16px; border:1px solid rgba(255,255,255,0.12); border-radius:10px; background:rgba(15,19,28,0.96); backdrop-filter:blur(14px); font-size:11.5px; color:#b9c1d3; transition:all .25s; z-index:80; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .segment { display:inline-flex; padding:3px; gap:2px; border-radius:10px; background:rgba(255,255,255,0.045); border:1px solid rgba(255,255,255,0.07); }
    .segment-item { height:26px; padding:0 11px; border-radius:8px; font-size:12px; font-weight:600; color:#596074; cursor:pointer; }
    .segment-item-active { background:color-mix(in srgb,var(--accent) 20%,transparent); color:#e9edf6; }
    /* scrollbar */
    ::-webkit-scrollbar { width:10px; height:10px; }
    ::-webkit-scrollbar-thumb { background:rgba(89,96,116,0.45); border-radius:999px; border:3px solid transparent; background-clip:content-box; }
  </style>
</head>
<body>
  <div id="shell" class="flex h-screen w-screen overflow-hidden app-bg" data-accent="admin">
    <aside id="sidebar" class="flex h-full w-[264px] shrink-0 flex-col border-r border-white/7 bg-surface/70 backdrop-blur-xl"></aside>
    <div class="flex min-w-0 flex-1 flex-col">
      <header id="topbar" class="flex h-[68px] shrink-0 items-center gap-4 border-b border-white/7 bg-surface/55 px-6 backdrop-blur-xl"></header>
      <main class="min-h-0 flex-1 overflow-y-auto px-7 py-6">
        <div class="mx-auto w-full max-w-[1400px]" id="main"></div>
      </main>
    </div>
  </div>
  <div id="toast" class="toast"></div>

<script>
// ---------- Data generators ----------
const FIRST = ['Muhammad','Ali','Ahmed','Hassan','Hussain','Usman','Bilal','Omar','Zain','Hamza','Ayesha','Fatima','Zainab','Maryam','Khadija','Sara','Hina','Noor','Iqra','Amina','Saad','Tariq','Kamran','Imran','Faisal'];
const LAST = ['Khan','Ahmed','Ali','Hussain','Malik','Sheikh','Qureshi','Butt','Raza','Chaudhry','Siddiqui','Farooq','Iqbal','Mirza','Shah','Jan','Yousafzai','Afridi'];
const CLASSES = ['Grade 1','Grade 2','Grade 3','Grade 4','Grade 5','Grade 6','Grade 7','Grade 8','Grade 9','Grade 10'];
const SECTIONS = ['A','B','C'];
const SUBJECTS = ['Mathematics','English','Urdu','Science','Islamic Studies','Computer','Physics','Chemistry','Biology','History'];
const TEACHER_ROLES = ['Senior Teacher','Teacher','Junior Teacher','Lab Instructor'];
function rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function pick(arr){ return arr[rnd(0,arr.length-1)]; }
function genStudents(n=60){
  return Array.from({length:n},(_,i)=>({
    id:i+1, name:pick(FIRST)+' '+pick(LAST), roll:rnd(1,40),
    className:pick(CLASSES), section:pick(SECTIONS),
    gender:Math.random()<0.5?'Male':'Female',
    phone:'03'+rnd(0,9)+rnd(10000000,99999999),
    fee:pick(['Paid','Due','Partial']),
    attendance:rnd(68,100),
    gpa:(2.5+Math.random()*1.5).toFixed(2)
  }));
}
function genStaff(n=18){
  return Array.from({length:n},(_,i)=>({
    id:i+1, name:pick(FIRST)+' '+pick(LAST),
    role:pick(TEACHER_ROLES), subject:pick(SUBJECTS),
    phone:'03'+rnd(0,9)+rnd(10000000,99999999),
    salary:rnd(35,90)*1000, status:pick(['Active','On Leave']),
    attendance:rnd(80,100)
  }));
}
function genFees(students){
  return students.map(s=>({
    id:s.id, student:s.name, className:s.className+'-'+s.section,
    amount:rnd(8,15)*1000, paid:s.fee==='Paid'?rnd(8,15)*1000:(s.fee==='Partial'?rnd(3,7)*1000:0),
    status:s.fee, due:rnd(1,28)+'/05/2026'
  }));
}
function genNotices(n=8){
  const titles=['Parent-Teacher Meeting','Exam Schedule Released','Fee Submission Deadline','Holiday Notice','Sports Day','Result Announcement','Admission Open','Library Hours Updated'];
  return Array.from({length:n},(_,i)=>({
    id:i+1, title:titles[i%titles.length], date:'2026-0'+rnd(1,9)+'-'+String(rnd(1,28)).padStart(2,'0'),
    body:'This is a demo notice with randomized content for the portfolio showcase. Please review the details and act accordingly.',
    audience:pick(['All','Students','Staff','Parents'])
  }));
}
function genExams(n=6){
  return Array.from({length:n},(_,i)=>({
    id:i+1, name:pick(['Midterm','Final','Unit Test','Quiz'])+' '+pick(SUBJECTS),
    className:pick(CLASSES), date:'2026-0'+rnd(1,9)+'-'+String(rnd(1,28)).padStart(2,'0'),
    totalMarks:pick([50,100]), status:pick(['Scheduled','Completed','Graded'])
  }));
}
function genExpenses(n=12){
  const cats=['Utilities','Salaries','Stationery','Maintenance','Transport','Events'];
  return Array.from({length:n},(_,i)=>({
    id:i+1, title:pick(['Electricity Bill','Staff Salary','Office Supplies','Building Repair','Bus Fuel','Annual Function']),
    category:pick(cats), amount:rnd(5,80)*1000, date:'2026-0'+rnd(1,9)+'-'+String(rnd(1,28)).padStart(2,'0'),
    status:pick(['Approved','Pending'])
  }));
}
function genTimetable(){
  const days=['Mon','Tue','Wed','Thu','Fri','Sat'];
  const periods=['08:00','09:00','10:00','11:00','12:00','13:00'];
  const grid={};
  days.forEach(d=>{ grid[d]=periods.map(()=>pick(SUBJECTS)); });
  return {days,periods,grid};
}
const state = { role:'admin', page:'/admin/dashboard', theme:'dark', data:null, search:'', filterClass:'All', timetable:null };
function regenerate(){
  state.data = { students:genStudents(60), staff:genStaff(18), notices:genNotices(8), exams:genExams(8), expenses:genExpenses(12) };
  state.data.fees = genFees(state.data.students);
  state.timetable = genTimetable();
}
regenerate();

// ---------- Menus ----------
const MENUS = {
 admin:{accent:'admin',groups:[
  {label:'Main',items:[{to:'/admin/dashboard',label:'Dashboard',icon:'layout-dashboard'}]},
  {label:'Manage',items:[
   {to:'/admin/students',label:'Students',icon:'graduation-cap'},
   {to:'/admin/staff',label:'Staff',icon:'id-card'},
   {to:'/admin/messaging',label:'Messaging',icon:'messages-square'},
   {to:'/admin/classes',label:'Classes',icon:'school'},
   {to:'/admin/subjects',label:'Subjects',icon:'book-open'}]},
  {label:'Academic',items:[
   {to:'/admin/attendance',label:'Attendance',icon:'calendar-check'},
   {to:'/admin/exams',label:'Exams',icon:'clipboard-list'},
   {to:'/admin/timetable',label:'Timetable',icon:'calendar-range'},
   {to:'/admin/notices',label:'Notices',icon:'megaphone'}]},
  {label:'Finance',items:[
   {to:'/admin/fees',label:'Fees',icon:'wallet'},
   {to:'/admin/expenses',label:'Expenses',icon:'trending-down'},
   {to:'/admin/salary',label:'Salary',icon:'banknote'}]},
  {label:'System',items:[
   {to:'/admin/users',label:'Users',icon:'user-cog'},
   {to:'/admin/attendance-reports',label:'Attendance Reports',icon:'user-check'},
   {to:'/admin/settings',label:'Settings',icon:'settings'},
   {to:'/admin/backup',label:'Backup',icon:'database'},
   {to:'/admin/audit',label:'Audit Log',icon:'scroll-text'}]}
 ]},
 office:{accent:'office',groups:[
  {label:'Main',items:[{to:'/office/dashboard',label:'Dashboard',icon:'layout-dashboard'}]},
  {label:'Manage',items:[
   {to:'/office/staff',label:'Staff',icon:'id-card'},
   {to:'/office/staff-attendance',label:'Staff Attendance',icon:'calendar-check'},
   {to:'/office/admissions',label:'Admissions',icon:'user-plus'}]},
  {label:'Finance',items:[
   {to:'/office/salary',label:'Salary',icon:'banknote'},
   {to:'/office/fees',label:'Fees',icon:'receipt'},
   {to:'/office/expenses',label:'Expenses',icon:'trending-down'}]},
  {label:'Academic',items:[
   {to:'/office/attendance',label:'Attendance',icon:'calendar-check'},
   {to:'/office/timetable',label:'Timetable',icon:'calendar-range'},
   {to:'/office/notices',label:'Notices',icon:'megaphone'}]},
  {label:'More',items:[
   {to:'/office/reports',label:'Reports',icon:'bar-chart-3'},
   {to:'/office/messaging',label:'Messaging',icon:'messages-square'}]}
 ]},
 teacher:{accent:'teacher',groups:[
  {label:'Main',items:[
   {to:'/teacher/dashboard',label:'Dashboard',icon:'layout-dashboard'},
   {to:'/teacher/classes',label:'My Classes',icon:'school'},
   {to:'/teacher/attendance',label:'Attendance',icon:'calendar-check'},
   {to:'/teacher/marks',label:'Marks Entry',icon:'pencil-ruler'},
   {to:'/teacher/timetable',label:'Timetable',icon:'calendar-range'}]},
  {label:'More',items:[
   {to:'/teacher/my-attendance',label:'My Attendance',icon:'clock'},
   {to:'/teacher/my-leave',label:'My Leave',icon:'umbrella'},
   {to:'/teacher/salary',label:'My Salary',icon:'banknote'},
   {to:'/teacher/notices',label:'Notices',icon:'megaphone'}]}
 ]},
 student:{accent:'student',groups:[
  {label:'Main',items:[
   {to:'/student/dashboard',label:'Dashboard',icon:'layout-dashboard'},
   {to:'/student/profile',label:'Profile',icon:'users'},
   {to:'/student/class',label:'My Class',icon:'school'},
   {to:'/student/attendance',label:'Attendance',icon:'calendar-check'},
   {to:'/student/results',label:'Results',icon:'table-2'},
   {to:'/student/fees',label:'Fees',icon:'wallet'}]},
  {label:'More',items:[
   {to:'/student/timetable',label:'Timetable',icon:'calendar-range'},
   {to:'/student/notices',label:'Notices',icon:'megaphone'}]}
 ]}
};
const ROLE_USERS = {
 admin:{name:'Principal Admin',username:'admin'},
 office:{name:'Office Manager',username:'office'},
 teacher:{name:'Ms. Ayesha Khan',username:'teacher'},
 student:{name:'Ali Hassan',username:'student'}
};
const SCHOOL_NAME = 'Demo Public School';

// ---------- Render shell ----------
function switchRole(role){
  state.role = role;
  state.page = MENUS[role].groups[0].items[0].to;
  document.getElementById('shell').setAttribute('data-accent', MENUS[role].accent);
  renderSidebar(); renderTopbar(); renderMain();
}
function navigate(path){ state.page = path; renderTopbar(); renderMain(); }
function toggleTheme(){
  state.theme = state.theme==='dark'?'light':'dark';
  document.documentElement.classList.toggle('light', state.theme==='light');
  document.documentElement.classList.toggle('dark', state.theme==='dark');
  renderTopbar();
}
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
function regenerateData(){ regenerate(); renderMain(); showToast('Demo data regenerated'); }

function renderSidebar(){
  const cfg = MENUS[state.role];
  const root=document.getElementById('sidebar');
  let html = `
    <div class="flex items-center gap-3 px-5 py-5">
      <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-b from-[var(--accent-2)] to-[var(--accent)] text-white shadow-[0_8px_18px_-8px_var(--accent)]">
        <i data-lucide="graduation-cap" class="w-[18px] h-[18px]"></i>
      </div>
      <div class="min-w-0">
        <p class="truncate text-[13.5px] font-semibold leading-tight text-ink">${SCHOOL_NAME}</p>
        <p class="truncate text-[11px] text-dim">${state.role.charAt(0).toUpperCase()+state.role.slice(1)} Workspace</p>
      </div>
    </div>
    <nav class="min-h-0 flex-1 overflow-y-auto px-3 pb-4">`;
  cfg.groups.forEach(g=>{
    html += `<div class="mb-4"><p class="text-[10.5px] font-semibold uppercase tracking-wider text-dim px-3 pb-2">${g.label}</p><div class="flex flex-col gap-0.5">`;
    g.items.forEach(it=>{
      const active = state.page===it.to;
      html += `<div class="nav-item ${active?'nav-item-active':''}" onclick="navigate('${it.to}')">
        <i data-lucide="${it.icon}" class="nav-icon w-4 h-4 shrink-0 text-dim"></i>
        <span class="flex-1 truncate">${it.label}</span>
      </div>`;
    });
    html += `</div></div>`;
  });
  html += `</nav>
    <div class="border-t border-white/7 p-3">
      <div class="flex items-center gap-2.5 rounded-xl px-2 py-2">
        <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl border border-white/12 bg-white/5 text-[12px] font-semibold text-ink">
          ${ROLE_USERS[state.role].name.split(' ').map(w=>w[0]).join('').slice(0,2)}
        </div>
        <div class="min-w-0 flex-1">
          <p class="truncate text-[12.5px] font-medium text-ink">${ROLE_USERS[state.role].name}</p>
          <p class="truncate text-[11px] text-dim">@${ROLE_USERS[state.role].username}</p>
        </div>
      </div>
      <div class="mt-2 flex gap-2">
        <button class="btn btn-sm flex-1" onclick="regenerateData()"><i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Regenerate</button>
      </div>
    </div>`;
  root.innerHTML = html;
  lucide.createIcons();
}

function renderTopbar(){
  const cfg = MENUS[state.role];
  const all = cfg.groups.flatMap(g=>g.items);
  const cur = all.filter(i=>state.page===i.to||state.page.startsWith(i.to+'/')).sort((a,b)=>b.to.length-a.to.length)[0];
  const title = cur ? cur.label : 'Dashboard';
  const root=document.getElementById('topbar');
  root.innerHTML = `
    <div class="min-w-0 flex-1">
      <p class="text-[10.5px] font-semibold uppercase tracking-wider text-dim">School Management System</p>
      <h1 class="truncate text-[15px] font-semibold tracking-tight text-ink">${title}</h1>
    </div>
    <div class="flex items-center gap-2">
      <select class="input" style="width:150px;height:36px" onchange="switchRole(this.value)">
        ${['admin','office','teacher','student'].map(r=>`<option value="${r}" ${state.role===r?'selected':''}>${r.charAt(0).toUpperCase()+r.slice(1)} view</option>`).join('')}
      </select>
      <button class="flex h-9 w-9 items-center justify-center rounded-xl border border-white/7 bg-white/5 text-muted hover:text-ink" onclick="toggleTheme()" title="Toggle theme">
        <i data-lucide="${state.theme==='dark'?'sun':'moon'}" class="w-4 h-4"></i>
      </button>
      <button class="flex h-9 w-9 items-center justify-center rounded-xl border border-white/7 bg-white/5 text-muted hover:text-ink" title="Notifications">
        <i data-lucide="bell" class="w-4 h-4"></i>
      </button>
    </div>`;
  lucide.createIcons();
}

// ---------- Pages ----------
function statCard(label,value,sub,icon,color){
  return `<div class="stat-card">
    <div class="flex items-center justify-between">
      <p class="text-[11px] font-semibold uppercase tracking-wider text-dim">${label}</p>
      <div class="flex h-9 w-9 items-center justify-center rounded-xl" style="background:color-mix(in srgb,${color} 14%,transparent);color:${color}"><i data-lucide="${icon}" class="w-4 h-4"></i></div>
    </div>
    <p class="mt-3 text-2xl font-semibold tracking-tight text-ink">${value}</p>
    <p class="mt-1 text-[11.5px] text-muted">${sub}</p>
  </div>`;
}
function renderDashboard(){
  const d=state.data;
  const students=d.students.length;
  const staff=d.staff.length;
  const classes=new Set(d.students.map(s=>s.className)).size;
  const collected=d.fees.reduce((a,f)=>a+f.paid,0);
  const due=d.fees.reduce((a,f)=>a+(f.amount-f.paid),0);
  if(state.role==='admin' || state.role==='office'){
    // monthly bars
    const months=['Jan','Feb','Mar','Apr','May','Jun'];
    const vals=months.map(()=>rnd(40,100));
    const max=Math.max(...vals);
    const bars=months.map((m,i)=>`<div class="flex flex-col items-center gap-2"><div class="w-8 rounded-t-md" style="height:${(vals[i]/max)*120}px;background:linear-gradient(180deg,var(--accent-2),var(--accent))"></div><span class="text-[10px] text-dim">${m}</span></div>`).join('');
    return `
      <div class="mb-6 flex items-center justify-between">
        <div><h2 class="text-xl font-semibold tracking-tight text-ink">Dashboard</h2><p class="text-[12.5px] text-muted">Overview of your school at a glance.</p></div>
        <button class="btn btn-primary btn-sm" onclick="regenerateData()"><i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Randomize</button>
      </div>
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
        ${statCard('Total Students',students,'Across all classes','users','#4c7df0')}
        ${statCard('Staff Members',staff,'Teaching & non-teaching','id-card','#10b981')}
        ${statCard('Classes',classes,'Active sections','school','#8b5cf6')}
        ${statCard('Fees Collected','PKR '+(collected/1000).toFixed(0)+'k','Due: PKR '+(due/1000).toFixed(0)+'k','wallet','#f59e0b')}
      </div>
      <div class="mt-6 grid grid-cols-1 gap-4 lg:grid-cols-3">
        <div class="panel-solid p-5 lg:col-span-2">
          <div class="mb-4 flex items-center justify-between"><h3 class="text-[14px] font-semibold text-ink">Fee collection trend</h3><span class="text-[11px] text-dim">Last 6 months</span></div>

function renderStudents(){
  const d=state.data;
  const filtered = d.students.filter(s=>{
    if(state.filterClass!=='All' && s.className!==state.filterClass) return false;

    return true;
  });
  return `
    <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
      <div><h2 class="text-xl font-semibold tracking-tight text-ink">Students</h2><p class="text-[12.5px] text-muted">${filtered.length} of ${d.students.length} students</p></div>

function addStudent(){
  const s = genStudents(1)[0]; s.id = state.data.students.length+1; state.data.students.unshift(s);
  state.data.fees.unshift({id:s.id,student:s.name,className:s.className+'-'+s.section,amount:rnd(8,15)*1000,paid:0,status:s.fee,due:'15/05/2026'});
  renderMain(); showToast('Student added (demo)');
}

      ${['Student Report','Fee Collection Report','Attendance Report','Salary Report','Expense Report','Exam Report'].map(t=>`<div class="panel-solid p-5 cursor-pointer hover:border-white/12" onclick="showToast('${t} generated (demo)')"><div class="flex h-10 w-10 items-center justify-center rounded-xl bg-white/5 text-[var(--accent)] mb-3"><i data-lucide="bar-chart-3" class="w-5 h-5"></i></div><h3 class="text-[13.5px] font-semibold text-ink">${t}</h3><p class="text-[11.5px] text-muted mt-1">Click to generate (demo)</p></div>`).join('')}
    </div>`;
}

function renderStaffAttendance(){
  const d=state.data;
  return `
    <div class="mb-4 flex items-center justify-between"><div><h2 class="text-xl font-semibold tracking-tight text-ink">Staff Attendance</h2><p class="text-[12.5px] text-muted">Track staff attendance.</p></div>
    <button class="btn btn-primary btn-sm" onclick="showToast('Saved (demo)')">Save</button></div>
    <div class="panel-solid overflow-hidden">
      <table class="data-table"><thead><tr><th>Staff</th><th>Role</th><th>Status</th></tr></thead><tbody>
        ${d.staff.map(s=>`<tr><td class="text-ink font-medium">${s.name}</td><td>${s.role}</td><td><span class="chip" style="color:${Math.random()<0.9?'#22c55e':'#ef4444'}">${Math.random()<0.9?'Present':'Absent'}</span></td></tr>`).join('')}
      </tbody></table>
    </div>`;
}

function renderGeneric(path){
  const name = path.split('/').pop().replace(/-/g,' ');
  return `
    <div class="mb-4"><h2 class="text-xl font-semibold tracking-tight text-ink">${name.charAt(0).toUpperCase()+name.slice(1)}</h2><p class="text-[12.5px] text-muted">Module preview with randomized demo data.</p></div>
    <div class="panel-solid p-8 text-center">
      <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-white/5 text-[var(--accent)]"><i data-lucide="construction" class="w-7 h-7"></i></div>
      <p class="text-[13px] text-muted">This module is available in the full desktop app. This demo shows the navigation and styling.</p>
      <button class="btn btn-primary btn-sm mt-4" onclick="navigate('/${state.role}/dashboard')">Back to dashboard</button>
    </div>`;
}

function renderMain(){
  const path=state.page;
  const el=document.getElementById('main');
  let html='';
  if(path.endsWith('dashboard')) html=renderDashboard();
  else if(path.includes('students')) html=renderStudents();
  else if(path.includes('staff-attendance')) html=renderStaffAttendance();
  else if(path.includes('staff')) html=renderStaff();
  else if(path.includes('classes')||path.includes('subjects')) html=renderClasses();
  else if(path.includes('attendance-reports')) html=renderAttendance();
  else if(path.includes('attendance')) html=renderAttendance();
  else if(path.includes('fees')||path.includes('student-fees')) html=renderFees();
  else if(path.includes('expenses')) html=renderExpenses();
  else if(path.includes('salary')) html=renderSalary();
  else if(path.includes('exams')) html=renderExams();
  else if(path.includes('marks')) html=renderMarks();
  else if(path.includes('timetable')) html=renderTimetable();
  else if(path.includes('notices')) html=renderNotices();
  else if(path.includes('users')) html=renderUsers();
  else if(path.includes('settings')) html=renderSettings();
  else if(path.includes('admissions')) html=renderAdmissions();
  else if(path.includes('reports')) html=renderReports();
  else if(path.includes('backup')||path.includes('audit')||path.includes('messaging')||path.includes('change-password')||path.includes('profile')||path.includes('class')||path.includes('results')||path.includes('my-')) html=renderGeneric(path);
  else html=renderGeneric(path);
  el.innerHTML=html;
  lucide.createIcons();
}

// init
document.documentElement.classList.add('dark');
renderSidebar(); renderTopbar(); renderMain();
</script>
</body>
</html>
